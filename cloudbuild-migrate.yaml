# Cloud Build configuration for Database Migrations
# Run manually: gcloud builds submit --config=cloudbuild-migrate.yaml

steps:
  # Step 1: Install dependencies
  - name: 'node:20'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        cd backend
        npm ci

  # Step 2: Run Prisma migrations via Cloud SQL Proxy
  - name: 'gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.8.0'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        /cloud-sql-proxy ${_CLOUD_SQL_CONNECTION} --port=5432 &
        sleep 5
        cd backend
        npx prisma migrate deploy
    secretEnv: ['DATABASE_URL']

substitutions:
  _CLOUD_SQL_CONNECTION: 'ai-resume-builder-prod:us-central1:resume-db'

availableSecrets:
  secretManager:
    - versionName: projects/${PROJECT_ID}/secrets/DATABASE_URL/versions/latest
      env: 'DATABASE_URL'

options:
  logging: CLOUD_LOGGING_ONLY

timeout: '600s'
