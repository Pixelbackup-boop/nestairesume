name: Test & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: us-central1
  CLOUD_RUN_SERVICE: resume-backend

jobs:
  # ============================================
  # Run Tests First
  # ============================================
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      # Backend tests
      - name: Install backend dependencies
        run: cd backend && npm ci

      - name: Run backend tests
        run: cd backend && npm test --if-present
        continue-on-error: true  # Don't block deployment on test failures

      # Frontend tests
      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Run frontend lint
        run: cd frontend && npm run lint --if-present
        continue-on-error: true  # Don't fail build on lint errors

      - name: Install Playwright browsers
        run: cd frontend && npx playwright install --with-deps chromium

      - name: Run E2E tests
        # Note: E2E tests are designed to work without backend
        # They test UI rendering and navigation, with graceful fallbacks for API calls
        run: cd frontend && npx playwright test
        continue-on-error: true  # Don't block deployment on E2E failures
        env:
          CI: true
          NEXT_PUBLIC_API_URL: http://localhost:4444

  # ============================================
  # Deploy Backend to Cloud Run
  # ============================================
  deploy-backend:
    name: Deploy Backend
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Configure Docker for GCR
        run: gcloud auth configure-docker

      - name: Build and Push Docker image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          cd backend
          docker build -t "gcr.io/${GCP_PROJECT_ID}/${CLOUD_RUN_SERVICE}:${IMAGE_TAG}" .
          docker push "gcr.io/${GCP_PROJECT_ID}/${CLOUD_RUN_SERVICE}:${IMAGE_TAG}"

      - name: Deploy to Cloud Run
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          gcloud run deploy "${CLOUD_RUN_SERVICE}" \
            --image "gcr.io/${GCP_PROJECT_ID}/${CLOUD_RUN_SERVICE}:${IMAGE_TAG}" \
            --region "${GCP_REGION}" \
            --platform managed \
            --allow-unauthenticated \
            --memory 4Gi \
            --cpu 2 \
            --min-instances 0 \
            --max-instances 10 \
            --set-env-vars="NODE_ENV=production" \
            --set-env-vars="PORT=8080" \
            --set-env-vars="HOST=0.0.0.0" \
            --set-env-vars="DATABASE_URL=${{ secrets.DATABASE_URL }}" \
            --set-env-vars="JWT_SECRET=${{ secrets.JWT_SECRET }}" \
            --set-env-vars="STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }}" \
            --set-env-vars="STRIPE_WEBHOOK_SECRET=${{ secrets.STRIPE_WEBHOOK_SECRET }}" \
            --set-env-vars="STRIPE_PRICE_STARTER=${{ secrets.STRIPE_PRICE_STARTER }}" \
            --set-env-vars="STRIPE_PRICE_GOLD=${{ secrets.STRIPE_PRICE_GOLD }}" \
            --set-env-vars="STRIPE_PRICE_DIAMOND=${{ secrets.STRIPE_PRICE_DIAMOND }}" \
            --set-env-vars="STRIPE_PRICE_PLATINUM=${{ secrets.STRIPE_PRICE_PLATINUM }}" \
            --set-env-vars="DEEPSEEK_API_KEY=${{ secrets.DEEPSEEK_API_KEY }}" \
            --set-env-vars="FRONTEND_URL=${{ secrets.FRONTEND_URL }}" \
            --add-cloudsql-instances="${{ secrets.GCP_PROJECT_ID }}:us-central1:resume-db"

  # ============================================
  # Deploy Frontend to Vercel
  # ============================================
  deploy-frontend:
    name: Deploy Frontend
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./frontend
          vercel-args: '--prod'
