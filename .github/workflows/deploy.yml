name: Test & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: us-central1
  ARTIFACT_REGISTRY: us-central1-docker.pkg.dev

jobs:
  # ============================================
  # Run Tests First
  # ============================================
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      # Backend tests
      - name: Install backend dependencies
        run: cd backend && npm ci

      - name: Run backend tests
        run: cd backend && npm test --if-present

      # Frontend tests
      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Run frontend lint
        run: cd frontend && npm run lint --if-present

      - name: Install Playwright browsers
        run: cd frontend && npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: cd frontend && npx playwright test
        env:
          CI: true
          NEXT_PUBLIC_API_URL: http://localhost:4444

  # ============================================
  # Deploy Backend to Cloud Run
  # ============================================
  deploy-backend:
    name: Deploy Backend
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.ARTIFACT_REGISTRY }}

      - name: Build and Push Docker image
        env:
          IMAGE: ${{ env.ARTIFACT_REGISTRY }}/${{ env.GCP_PROJECT_ID }}/resume-builder/backend:${{ github.sha }}
          IMAGE_LATEST: ${{ env.ARTIFACT_REGISTRY }}/${{ env.GCP_PROJECT_ID }}/resume-builder/backend:latest
        run: |
          cd backend
          docker build -t "$IMAGE" -t "$IMAGE_LATEST" .
          docker push "$IMAGE"
          docker push "$IMAGE_LATEST"

      - name: Deploy to Cloud Run
        env:
          IMAGE: ${{ env.ARTIFACT_REGISTRY }}/${{ env.GCP_PROJECT_ID }}/resume-builder/backend:${{ github.sha }}
        run: |
          gcloud run deploy resume-backend \
            --image "$IMAGE" \
            --region ${{ env.GCP_REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --memory 4Gi \
            --cpu 2 \
            --min-instances 0 \
            --max-instances 20 \
            --concurrency 8 \
            --timeout 300 \
            --set-env-vars="NODE_ENV=production,HOST=0.0.0.0" \
            --set-env-vars="STRIPE_PRICE_STARTER=${{ secrets.STRIPE_PRICE_STARTER }}" \
            --set-env-vars="STRIPE_PRICE_GOLD=${{ secrets.STRIPE_PRICE_GOLD }}" \
            --set-env-vars="STRIPE_PRICE_DIAMOND=${{ secrets.STRIPE_PRICE_DIAMOND }}" \
            --set-env-vars="STRIPE_PRICE_PLATINUM=${{ secrets.STRIPE_PRICE_PLATINUM }}" \
            --set-env-vars="FRONTEND_URL=${{ secrets.FRONTEND_URL }}" \
            --set-env-vars="DATABASE_URL=${{ secrets.DATABASE_URL }}" \
            --set-env-vars="JWT_SECRET=${{ secrets.JWT_SECRET }}" \
            --set-env-vars="STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }}" \
            --set-env-vars="STRIPE_WEBHOOK_SECRET=${{ secrets.STRIPE_WEBHOOK_SECRET }}" \
            --set-env-vars="DEEPSEEK_API_KEY=${{ secrets.DEEPSEEK_API_KEY }}" \
            --add-cloudsql-instances="${{ secrets.GCP_PROJECT_ID }}:${{ env.GCP_REGION }}:resume-db"

      - name: Verify backend deployment
        run: |
          BACKEND_URL=$(gcloud run services describe resume-backend --region ${{ env.GCP_REGION }} --format 'value(status.url)')
          echo "Backend URL: $BACKEND_URL"
          # Wait for the new revision to be ready
          sleep 10
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$BACKEND_URL/health" --max-time 30)
          if [ "$HTTP_CODE" != "200" ]; then
            echo "Health check failed with HTTP $HTTP_CODE. Rolling back..."
            gcloud run services update-traffic resume-backend \
              --region ${{ env.GCP_REGION }} \
              --to-revisions=LATEST=0
            exit 1
          fi
          echo "Health check passed (HTTP $HTTP_CODE)"

  # ============================================
  # Deploy Frontend to Cloud Run
  # ============================================
  deploy-frontend:
    name: Deploy Frontend
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.ARTIFACT_REGISTRY }}

      - name: Build and Push Docker image
        env:
          IMAGE: ${{ env.ARTIFACT_REGISTRY }}/${{ env.GCP_PROJECT_ID }}/resume-builder/frontend:${{ github.sha }}
          IMAGE_LATEST: ${{ env.ARTIFACT_REGISTRY }}/${{ env.GCP_PROJECT_ID }}/resume-builder/frontend:latest
        run: |
          cd frontend
          docker build \
            --build-arg NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }} \
            --build-arg NEXT_PUBLIC_SITE_URL=${{ secrets.NEXT_PUBLIC_SITE_URL }} \
            --build-arg NEXT_PUBLIC_GA_MEASUREMENT_ID=${{ secrets.GA_MEASUREMENT_ID }} \
            -t "$IMAGE" -t "$IMAGE_LATEST" .
          docker push "$IMAGE"
          docker push "$IMAGE_LATEST"

      - name: Deploy to Cloud Run
        env:
          IMAGE: ${{ env.ARTIFACT_REGISTRY }}/${{ env.GCP_PROJECT_ID }}/resume-builder/frontend:${{ github.sha }}
        run: |
          gcloud run deploy resume-frontend \
            --image "$IMAGE" \
            --region ${{ env.GCP_REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --memory 1Gi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 50 \
            --concurrency 100 \
            --timeout 60 \
            --set-env-vars="NODE_ENV=production" \
            --set-env-vars="NEXTAUTH_URL=${{ secrets.NEXT_PUBLIC_SITE_URL }}" \
            --set-env-vars="BACKEND_URL=${{ secrets.NEXT_PUBLIC_API_URL }}" \
            --set-env-vars="NEXTAUTH_SECRET=${{ secrets.NEXTAUTH_SECRET }}" \
            --set-env-vars="GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}" \
            --set-env-vars="GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}" \
            --set-env-vars="GITHUB_CLIENT_ID=${{ secrets.GH_CLIENT_ID }}" \
            --set-env-vars="GITHUB_CLIENT_SECRET=${{ secrets.GH_CLIENT_SECRET }}" \
            --set-env-vars="LINKEDIN_CLIENT_ID=${{ secrets.LINKEDIN_CLIENT_ID }}" \
            --set-env-vars="LINKEDIN_CLIENT_SECRET=${{ secrets.LINKEDIN_CLIENT_SECRET }}"

      - name: Verify frontend deployment
        run: |
          FRONTEND_URL=$(gcloud run services describe resume-frontend --region ${{ env.GCP_REGION }} --format 'value(status.url)')
          echo "Frontend URL: $FRONTEND_URL"
          sleep 10
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$FRONTEND_URL" --max-time 30)
          if [ "$HTTP_CODE" != "200" ]; then
            echo "Health check failed with HTTP $HTTP_CODE. Rolling back..."
            gcloud run services update-traffic resume-frontend \
              --region ${{ env.GCP_REGION }} \
              --to-revisions=LATEST=0
            exit 1
          fi
          echo "Health check passed (HTTP $HTTP_CODE)"
