<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#0d1117"/>

  <!-- Grid pattern background -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow">
      <stop offset="0%" stop-color="#00dc82" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#00dc82" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Gradient glow -->
  <ellipse cx="600" cy="315" rx="400" ry="250" fill="url(#glow)"/>

  <!-- Envelope / letter icon -->
  <rect x="490" y="170" width="220" height="160" rx="8" fill="#161b22" stroke="#00dc82" stroke-width="2"/>
  <!-- Envelope flap -->
  <path d="M490 170 L600 260 L710 170" fill="none" stroke="#00dc82" stroke-width="2"/>
  <!-- Letter peeking out -->
  <rect x="510" y="140" width="180" height="120" rx="4" fill="#1c2333" stroke="rgba(0,220,130,0.4)" stroke-width="1.5"/>
  <rect x="530" y="160" width="120" height="8" rx="2" fill="#00dc82" opacity="0.7"/>
  <rect x="530" y="178" width="140" height="5" rx="2" fill="rgba(255,255,255,0.2)"/>
  <rect x="530" y="190" width="100" height="5" rx="2" fill="rgba(255,255,255,0.2)"/>
  <rect x="530" y="202" width="130" height="5" rx="2" fill="rgba(255,255,255,0.2)"/>
  <rect x="530" y="220" width="80" height="5" rx="2" fill="rgba(255,255,255,0.2)"/>

  <!-- Stamp / seal -->
  <circle cx="690" cy="160" r="26" fill="none" stroke="#00dc82" stroke-width="2"/>
  <circle cx="690" cy="160" r="18" fill="none" stroke="#00dc82" stroke-width="1" opacity="0.5"/>
  <path d="M680 160 L687 168 L702 152" stroke="#00dc82" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Text -->
  <text x="600" y="415" font-family="system-ui, sans-serif" font-size="32" font-weight="bold" fill="white" text-anchor="middle">Experience Letter Format</text>
  <text x="600" y="455" font-family="system-ui, sans-serif" font-size="18" fill="rgba(255,255,255,0.6)" text-anchor="middle">Templates and examples for employment verification</text>
</svg>