<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <!-- Background -->
  <rect width="800" height="450" fill="#F8FAFC"/>

  <!-- Decorative circles -->
  <circle cx="700" cy="380" r="100" fill="#14B8A6" opacity="0.08"/>
  <circle cx="100" cy="100" r="80" fill="#0D9488" opacity="0.08"/>

  <!-- Calendar/Night icon -->
  <g transform="translate(60, 100)">
    <!-- Moon -->
    <circle cx="60" cy="60" r="50" fill="#1E293B"/>
    <circle cx="80" cy="50" r="40" fill="#F8FAFC"/>
    <!-- Stars -->
    <circle cx="30" cy="30" r="3" fill="#FCD34D"/>
    <circle cx="100" cy="45" r="2" fill="#FCD34D"/>
    <circle cx="45" cy="80" r="2" fill="#FCD34D"/>
    <text x="60" y="180" font-family="Arial" font-size="12" fill="#64748B" text-anchor="middle" font-weight="bold">NIGHT BEFORE</text>
  </g>

  <!-- Main checklist card -->
  <g transform="translate(200, 40)">
    <!-- Card shadow -->
    <rect x="6" y="6" width="380" height="360" rx="12" fill="#0D9488" opacity="0.15"/>
    <!-- Card -->
    <rect width="380" height="360" rx="12" fill="white" stroke="#E2E8F0" stroke-width="2"/>

    <!-- Header -->
    <rect x="0" y="0" width="380" height="50" rx="12" fill="#14B8A6"/>
    <rect x="0" y="25" width="380" height="25" fill="#14B8A6"/>
    <text x="190" y="32" font-family="Arial" font-size="16" fill="white" text-anchor="middle" font-weight="bold">INTERVIEW PREP CHECKLIST</text>

    <!-- Section 1: Research -->
    <g transform="translate(20, 70)">
      <rect x="0" y="0" width="340" height="30" rx="6" fill="#F0FDFA"/>
      <text x="10" y="20" font-family="Arial" font-size="11" fill="#0D9488" font-weight="bold">📋 RESEARCH (10 min)</text>
    </g>

    <g transform="translate(30, 105)">
      <rect width="16" height="16" rx="3" fill="#10B981"/>
      <path d="M4 8 L6 10 L12 4" stroke="white" stroke-width="2" fill="none"/>
      <text x="24" y="12" font-family="Arial" font-size="11" fill="#334155">Review job description</text>
    </g>

    <g transform="translate(30, 128)">
      <rect width="16" height="16" rx="3" fill="#10B981"/>
      <path d="M4 8 L6 10 L12 4" stroke="white" stroke-width="2" fill="none"/>
      <text x="24" y="12" font-family="Arial" font-size="11" fill="#334155">Company About page</text>
    </g>

    <g transform="translate(200, 105)">
      <rect width="16" height="16" rx="3" fill="#10B981"/>
      <path d="M4 8 L6 10 L12 4" stroke="white" stroke-width="2" fill="none"/>
      <text x="24" y="12" font-family="Arial" font-size="11" fill="#334155">Interviewer LinkedIn</text>
    </g>

    <!-- Section 2: Stories -->
    <g transform="translate(20, 155)">
      <rect x="0" y="0" width="340" height="30" rx="6" fill="#FEF3C7"/>
      <text x="10" y="20" font-family="Arial" font-size="11" fill="#D97706" font-weight="bold">⭐ STAR STORIES (15 min)</text>
    </g>

    <g transform="translate(30, 190)">
      <rect width="16" height="16" rx="3" fill="#F59E0B"/>
      <path d="M4 8 L6 10 L12 4" stroke="white" stroke-width="2" fill="none"/>
      <text x="24" y="12" font-family="Arial" font-size="11" fill="#334155">2 achievement stories</text>
    </g>

    <g transform="translate(200, 190)">
      <rect width="16" height="16" rx="3" stroke="#F59E0B" stroke-width="2" fill="white"/>
      <text x="24" y="12" font-family="Arial" font-size="11" fill="#94A3B8">"Tell me about yourself"</text>
    </g>

    <!-- Section 3: Logistics -->
    <g transform="translate(20, 220)">
      <rect x="0" y="0" width="340" height="30" rx="6" fill="#EDE9FE"/>
      <text x="10" y="20" font-family="Arial" font-size="11" fill="#7C3AED" font-weight="bold">📍 LOGISTICS (5 min)</text>
    </g>

    <g transform="translate(30, 255)">
      <rect width="16" height="16" rx="3" fill="#8B5CF6"/>
      <path d="M4 8 L6 10 L12 4" stroke="white" stroke-width="2" fill="none"/>
      <text x="24" y="12" font-family="Arial" font-size="11" fill="#334155">Confirm time &amp; location</text>
    </g>

    <g transform="translate(200, 255)">
      <rect width="16" height="16" rx="3" fill="#8B5CF6"/>
      <path d="M4 8 L6 10 L12 4" stroke="white" stroke-width="2" fill="none"/>
      <text x="24" y="12" font-family="Arial" font-size="11" fill="#334155">Outfit ready</text>
    </g>

    <!-- Section 4: Video (if applicable) -->
    <g transform="translate(20, 285)">
      <rect x="0" y="0" width="340" height="30" rx="6" fill="#DBEAFE"/>
      <text x="10" y="20" font-family="Arial" font-size="11" fill="#2563EB" font-weight="bold">💻 VIDEO INTERVIEW</text>
    </g>

    <g transform="translate(30, 320)">
      <rect width="16" height="16" rx="3" stroke="#3B82F6" stroke-width="2" fill="white"/>
      <text x="24" y="12" font-family="Arial" font-size="11" fill="#94A3B8">Test camera &amp; mic</text>
    </g>

    <g transform="translate(200, 320)">
      <rect width="16" height="16" rx="3" stroke="#3B82F6" stroke-width="2" fill="white"/>
      <text x="24" y="12" font-family="Arial" font-size="11" fill="#94A3B8">Check background</text>
    </g>
  </g>

  <!-- Success badge -->
  <g transform="translate(620, 80)">
    <circle cx="50" cy="50" r="45" fill="#10B981"/>
    <circle cx="50" cy="50" r="35" fill="#059669"/>
    <text x="50" y="45" font-family="Arial" font-size="28" fill="white" text-anchor="middle" font-weight="bold">✓</text>
    <text x="50" y="65" font-family="Arial" font-size="10" fill="white" text-anchor="middle">READY</text>
  </g>

  <!-- Time indicator -->
  <g transform="translate(620, 200)">
    <rect x="0" y="0" width="100" height="60" rx="8" fill="white" stroke="#E2E8F0" stroke-width="2"/>
    <text x="50" y="30" font-family="Arial" font-size="20" fill="#0D9488" text-anchor="middle" font-weight="bold">30</text>
    <text x="50" y="48" font-family="Arial" font-size="10" fill="#64748B" text-anchor="middle">MINUTES</text>
  </g>

  <!-- Questions badge -->
  <g transform="translate(620, 290)">
    <rect x="0" y="0" width="100" height="80" rx="8" fill="#F0FDFA" stroke="#14B8A6" stroke-width="2"/>
    <text x="50" y="30" font-family="Arial" font-size="12" fill="#0D9488" text-anchor="middle" font-weight="bold">PREPARE</text>
    <text x="50" y="55" font-family="Arial" font-size="24" fill="#14B8A6" text-anchor="middle" font-weight="bold">5</text>
    <text x="50" y="72" font-family="Arial" font-size="10" fill="#64748B" text-anchor="middle">QUESTIONS</text>
  </g>

  <!-- Bottom gradient -->
  <rect x="0" y="440" width="800" height="10" fill="url(#interviewGradient)"/>
  <defs>
    <linearGradient id="interviewGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#14B8A6"/>
      <stop offset="50%" style="stop-color:#10B981"/>
      <stop offset="100%" style="stop-color:#0D9488"/>
    </linearGradient>
  </defs>
</svg>
