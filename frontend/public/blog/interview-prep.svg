<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#0d1117"/>

  <!-- Grid pattern background -->
  <defs>
    <pattern id="grid3" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#grid3)"/>

  <!-- Purple gradient glow -->
  <ellipse cx="600" cy="315" rx="400" ry="250" fill="url(#purpleglow)"/>
  <defs>
    <radialGradient id="purpleglow">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Person silhouette -->
  <circle cx="520" cy="200" r="40" fill="#161b22" stroke="#8b5cf6" stroke-width="2"/>
  <path d="M480 310 Q480 260 520 260 Q560 260 560 310" fill="#161b22" stroke="#8b5cf6" stroke-width="2"/>

  <!-- Speech bubble -->
  <rect x="580" y="170" width="140" height="80" rx="10" fill="#161b22" stroke="#8b5cf6" stroke-width="2"/>
  <path d="M580 210 L560 220 L580 230" fill="#161b22" stroke="#8b5cf6" stroke-width="2"/>

  <!-- Question marks in bubble -->
  <text x="650" y="220" font-family="system-ui, sans-serif" font-size="36" font-weight="bold" fill="#8b5cf6" text-anchor="middle">Q&amp;A</text>

  <!-- Checklist -->
  <rect x="500" y="330" width="20" height="20" rx="4" fill="none" stroke="#00dc82" stroke-width="2"/>
  <path d="M505 340 L510 347 L520 333" stroke="#00dc82" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <rect x="540" y="337" width="80" height="6" rx="2" fill="rgba(255,255,255,0.3)"/>

  <rect x="640" y="330" width="20" height="20" rx="4" fill="none" stroke="#00dc82" stroke-width="2"/>
  <path d="M645 340 L650 347 L660 333" stroke="#00dc82" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <rect x="680" y="337" width="80" height="6" rx="2" fill="rgba(255,255,255,0.3)"/>

  <!-- Text -->
  <text x="600" y="430" font-family="system-ui, sans-serif" font-size="32" font-weight="bold" fill="white" text-anchor="middle">Interview Preparation Guide</text>
  <text x="600" y="470" font-family="system-ui, sans-serif" font-size="18" fill="rgba(255,255,255,0.6)" text-anchor="middle">Master your next job interview</text>
</svg>