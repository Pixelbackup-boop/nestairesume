<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#0d1117"/>

  <!-- Grid pattern background -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow">
      <stop offset="0%" stop-color="#00dc82" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#00dc82" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Gradient glow -->
  <ellipse cx="600" cy="315" rx="400" ry="250" fill="url(#glow)"/>

  <!-- ID card / biodata icon -->
  <rect x="490" y="150" width="220" height="260" rx="10" fill="#161b22" stroke="#00dc82" stroke-width="2"/>

  <!-- Photo placeholder circle -->
  <circle cx="600" cy="210" r="35" fill="rgba(0,220,130,0.2)" stroke="#00dc82" stroke-width="1.5"/>
  <!-- Person silhouette -->
  <circle cx="600" cy="200" r="12" fill="#00dc82" opacity="0.5"/>
  <path d="M578 230 C578 215, 622 215, 622 230" fill="#00dc82" opacity="0.5"/>

  <!-- Name line -->
  <rect x="545" y="260" width="110" height="10" rx="2" fill="#00dc82" opacity="0.8"/>

  <!-- Info rows -->
  <rect x="520" y="285" width="60" height="6" rx="2" fill="rgba(255,255,255,0.4)"/>
  <rect x="590" y="285" width="90" height="6" rx="2" fill="rgba(255,255,255,0.2)"/>

  <rect x="520" y="302" width="50" height="6" rx="2" fill="rgba(255,255,255,0.4)"/>
  <rect x="590" y="302" width="80" height="6" rx="2" fill="rgba(255,255,255,0.2)"/>

  <rect x="520" y="319" width="55" height="6" rx="2" fill="rgba(255,255,255,0.4)"/>
  <rect x="590" y="319" width="100" height="6" rx="2" fill="rgba(255,255,255,0.2)"/>

  <rect x="520" y="336" width="45" height="6" rx="2" fill="rgba(255,255,255,0.4)"/>
  <rect x="590" y="336" width="70" height="6" rx="2" fill="rgba(255,255,255,0.2)"/>

  <rect x="520" y="353" width="65" height="6" rx="2" fill="rgba(255,255,255,0.4)"/>
  <rect x="590" y="353" width="85" height="6" rx="2" fill="rgba(255,255,255,0.2)"/>

  <rect x="520" y="375" width="160" height="8" rx="2" fill="#00dc82" opacity="0.3"/>

  <!-- Text -->
  <text x="600" y="460" font-family="system-ui, sans-serif" font-size="32" font-weight="bold" fill="white" text-anchor="middle">Biodata Format Examples</text>
  <text x="600" y="500" font-family="system-ui, sans-serif" font-size="18" fill="rgba(255,255,255,0.6)" text-anchor="middle">Templates with answers for jobs and marriage</text>
</svg>