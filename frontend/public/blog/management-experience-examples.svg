<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#0d1117"/>

  <!-- Grid pattern background -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow">
      <stop offset="0%" stop-color="#00dc82" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#00dc82" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Gradient glow -->
  <ellipse cx="600" cy="315" rx="400" ry="250" fill="url(#glow)"/>

  <!-- Org chart / team icon -->
  <!-- Top person -->
  <circle cx="600" cy="170" r="22" fill="#00dc82"/>
  <rect x="580" y="195" width="40" height="30" rx="6" fill="#161b22" stroke="#00dc82" stroke-width="2"/>
  <!-- Connecting lines -->
  <line x1="600" y1="225" x2="600" y2="255" stroke="#00dc82" stroke-width="2" opacity="0.6"/>
  <line x1="500" y1="255" x2="700" y2="255" stroke="#00dc82" stroke-width="2" opacity="0.6"/>
  <line x1="500" y1="255" x2="500" y2="275" stroke="#00dc82" stroke-width="2" opacity="0.6"/>
  <line x1="600" y1="255" x2="600" y2="275" stroke="#00dc82" stroke-width="2" opacity="0.6"/>
  <line x1="700" y1="255" x2="700" y2="275" stroke="#00dc82" stroke-width="2" opacity="0.6"/>
  <!-- Three team members -->
  <circle cx="500" cy="295" r="18" fill="rgba(0,220,130,0.4)"/>
  <rect x="482" y="316" width="36" height="24" rx="5" fill="#161b22" stroke="rgba(0,220,130,0.4)" stroke-width="1.5"/>
  <circle cx="600" cy="295" r="18" fill="rgba(0,220,130,0.4)"/>
  <rect x="582" y="316" width="36" height="24" rx="5" fill="#161b22" stroke="rgba(0,220,130,0.4)" stroke-width="1.5"/>
  <circle cx="700" cy="295" r="18" fill="rgba(0,220,130,0.4)"/>
  <rect x="682" y="316" width="36" height="24" rx="5" fill="#161b22" stroke="rgba(0,220,130,0.4)" stroke-width="1.5"/>

  <!-- Upward arrow accent -->
  <path d="M730 190 L745 170 L760 190" stroke="#00dc82" stroke-width="3" stroke-linecap="round" fill="none"/>
  <line x1="745" y1="170" x2="745" y2="220" stroke="#00dc82" stroke-width="3" stroke-linecap="round"/>

  <!-- Text -->
  <text x="600" y="415" font-family="system-ui, sans-serif" font-size="32" font-weight="bold" fill="white" text-anchor="middle">Management Experience Examples</text>
  <text x="600" y="455" font-family="system-ui, sans-serif" font-size="18" fill="rgba(255,255,255,0.6)" text-anchor="middle">Leadership bullet points that prove impact</text>
</svg>