<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#0d1117"/>

  <!-- Grid pattern background -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Gradient glow -->
  <ellipse cx="600" cy="315" rx="400" ry="250" fill="url(#glow)"/>
  <defs>
    <radialGradient id="glow">
      <stop offset="0%" stop-color="#00dc82" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#00dc82" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Bar chart representing skills -->
  <rect x="440" y="280" width="40" height="100" rx="4" fill="rgba(255,255,255,0.2)"/>
  <rect x="500" y="240" width="40" height="140" rx="4" fill="rgba(255,255,255,0.3)"/>
  <rect x="560" y="200" width="40" height="180" rx="4" fill="rgba(255,255,255,0.4)"/>
  <rect x="620" y="160" width="40" height="220" rx="4" fill="#00dc82" opacity="0.8"/>
  <rect x="680" y="190" width="40" height="190" rx="4" fill="rgba(255,255,255,0.4)"/>
  <rect x="740" y="230" width="40" height="150" rx="4" fill="rgba(255,255,255,0.3)"/>

  <!-- Dollar sign on top bar -->
  <circle cx="640" cy="140" r="25" fill="#00dc82"/>
  <text x="640" y="148" font-family="system-ui, sans-serif" font-size="24" font-weight="bold" fill="#0d1117" text-anchor="middle">$</text>

  <!-- Trend line -->
  <path d="M450 330 L510 290 L570 250 L630 210 L690 235 L750 275" stroke="#00dc82" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="630" cy="210" r="6" fill="#00dc82"/>

  <!-- Text -->
  <text x="600" y="440" font-family="system-ui, sans-serif" font-size="32" font-weight="bold" fill="white" text-anchor="middle">25 High Paying Skills</text>
  <text x="600" y="480" font-family="system-ui, sans-serif" font-size="18" fill="rgba(255,255,255,0.6)" text-anchor="middle">Skills that command premium salaries in 2026</text>
</svg>