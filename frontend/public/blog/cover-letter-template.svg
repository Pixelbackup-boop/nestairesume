<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <!-- Background -->
  <rect width="800" height="450" fill="#F8FAFC"/>

  <!-- Decorative circles -->
  <circle cx="700" cy="80" r="120" fill="#14B8A6" opacity="0.1"/>
  <circle cx="100" cy="380" r="80" fill="#0D9488" opacity="0.1"/>

  <!-- Main document -->
  <g transform="translate(250, 50)">
    <!-- Paper shadow -->
    <rect x="8" y="8" width="300" height="350" rx="8" fill="#0D9488" opacity="0.15"/>
    <!-- Paper -->
    <rect width="300" height="350" rx="8" fill="white" stroke="#E2E8F0" stroke-width="2"/>

    <!-- Header area -->
    <rect x="20" y="20" width="260" height="60" rx="4" fill="#F0FDFA"/>

    <!-- Name placeholder -->
    <rect x="30" y="30" width="120" height="14" rx="2" fill="#14B8A6"/>
    <rect x="30" y="50" width="180" height="8" rx="2" fill="#5EEAD4"/>

    <!-- Paragraph 1 - Hook (highlighted) -->
    <rect x="20" y="100" width="260" height="50" rx="4" fill="#CCFBF1" stroke="#14B8A6" stroke-width="2"/>
    <text x="30" y="118" font-family="Arial, sans-serif" font-size="10" fill="#0D9488" font-weight="bold">1. HOOK</text>
    <rect x="30" y="128" width="240" height="6" rx="1" fill="#5EEAD4"/>
    <rect x="30" y="138" width="200" height="6" rx="1" fill="#5EEAD4"/>

    <!-- Paragraph 2 - Value -->
    <rect x="20" y="160" width="260" height="50" rx="4" fill="#F1F5F9"/>
    <text x="30" y="178" font-family="Arial, sans-serif" font-size="10" fill="#64748B" font-weight="bold">2. VALUE</text>
    <rect x="30" y="188" width="240" height="6" rx="1" fill="#CBD5E1"/>
    <rect x="30" y="198" width="220" height="6" rx="1" fill="#CBD5E1"/>

    <!-- Paragraph 3 - Connection -->
    <rect x="20" y="220" width="260" height="50" rx="4" fill="#F1F5F9"/>
    <text x="30" y="238" font-family="Arial, sans-serif" font-size="10" fill="#64748B" font-weight="bold">3. CONNECTION</text>
    <rect x="30" y="248" width="240" height="6" rx="1" fill="#CBD5E1"/>
    <rect x="30" y="258" width="180" height="6" rx="1" fill="#CBD5E1"/>

    <!-- Paragraph 4 - Close -->
    <rect x="20" y="280" width="260" height="45" rx="4" fill="#F1F5F9"/>
    <text x="30" y="298" font-family="Arial, sans-serif" font-size="10" fill="#64748B" font-weight="bold">4. CLOSE</text>
    <rect x="30" y="308" width="200" height="6" rx="1" fill="#CBD5E1"/>

    <!-- Signature line -->
    <rect x="30" y="335" width="100" height="8" rx="2" fill="#14B8A6"/>
  </g>

  <!-- Timer icon -->
  <g transform="translate(600, 180)">
    <circle cx="50" cy="50" r="45" fill="white" stroke="#14B8A6" stroke-width="3"/>
    <circle cx="50" cy="50" r="38" fill="#F0FDFA"/>
    <text x="50" y="45" font-family="Arial, sans-serif" font-size="24" fill="#0D9488" text-anchor="middle" font-weight="bold">15</text>
    <text x="50" y="62" font-family="Arial, sans-serif" font-size="10" fill="#5EEAD4" text-anchor="middle">MINUTES</text>
    <!-- Clock hand -->
    <line x1="50" y1="50" x2="50" y2="25" stroke="#14B8A6" stroke-width="3" stroke-linecap="round"/>
    <line x1="50" y1="50" x2="65" y2="50" stroke="#0D9488" stroke-width="2" stroke-linecap="round"/>
    <circle cx="50" cy="50" r="4" fill="#0D9488"/>
  </g>

  <!-- Checkmark badge -->
  <g transform="translate(80, 120)">
    <circle cx="40" cy="40" r="35" fill="#14B8A6"/>
    <path d="M25 40 L35 50 L55 30" stroke="white" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Text labels -->
  <text x="80" y="220" font-family="Arial, sans-serif" font-size="14" fill="#0D9488" font-weight="bold">4-Paragraph</text>
  <text x="80" y="240" font-family="Arial, sans-serif" font-size="14" fill="#0D9488" font-weight="bold">Formula</text>

  <!-- Bottom decoration -->
  <rect x="0" y="440" width="800" height="10" fill="url(#gradient)"/>
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#14B8A6"/>
      <stop offset="100%" style="stop-color:#0D9488"/>
    </linearGradient>
  </defs>
</svg>
