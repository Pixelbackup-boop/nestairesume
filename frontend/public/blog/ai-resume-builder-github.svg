<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#0d1117"/>

  <!-- Grid pattern background -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow">
      <stop offset="0%" stop-color="#00dc82" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#00dc82" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Gradient glow -->
  <ellipse cx="600" cy="315" rx="400" ry="250" fill="url(#glow)"/>

  <!-- Code bracket icon -->
  <text x="510" y="270" font-family="monospace" font-size="80" fill="#00dc82" opacity="0.9">&lt;/&gt;</text>

  <!-- Git branch lines -->
  <circle cx="530" cy="310" r="8" fill="#00dc82" opacity="0.6"/>
  <line x1="530" y1="318" x2="530" y2="370" stroke="#00dc82" stroke-width="2" opacity="0.4"/>
  <circle cx="530" cy="378" r="6" fill="#00dc82" opacity="0.4"/>

  <circle cx="620" cy="310" r="8" fill="#00dc82" opacity="0.6"/>
  <line x1="620" y1="318" x2="620" y2="345" stroke="#00dc82" stroke-width="2" opacity="0.4"/>
  <!-- Branch fork -->
  <line x1="620" y1="345" x2="660" y2="365" stroke="#00dc82" stroke-width="2" opacity="0.4"/>
  <circle cx="660" cy="373" r="6" fill="#00dc82" opacity="0.4"/>
  <line x1="620" y1="345" x2="620" y2="370" stroke="#00dc82" stroke-width="2" opacity="0.4"/>
  <circle cx="620" cy="378" r="6" fill="#00dc82" opacity="0.4"/>

  <!-- Document mini icon -->
  <rect x="680" y="220" width="50" height="65" rx="4" fill="#161b22" stroke="#00dc82" stroke-width="1.5"/>
  <rect x="690" y="235" width="30" height="5" rx="1" fill="#00dc82" opacity="0.6"/>
  <rect x="690" y="247" width="25" height="4" rx="1" fill="rgba(255,255,255,0.2)"/>
  <rect x="690" y="257" width="28" height="4" rx="1" fill="rgba(255,255,255,0.2)"/>
  <rect x="690" y="267" width="20" height="4" rx="1" fill="rgba(255,255,255,0.2)"/>

  <!-- Text -->
  <text x="600" y="445" font-family="system-ui, sans-serif" font-size="32" font-weight="bold" fill="white" text-anchor="middle">AI Resume Builder GitHub</text>
  <text x="600" y="485" font-family="system-ui, sans-serif" font-size="18" fill="rgba(255,255,255,0.6)" text-anchor="middle">Open source tools and alternatives compared</text>
</svg>