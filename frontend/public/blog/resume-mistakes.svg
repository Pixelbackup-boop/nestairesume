<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#0d1117"/>

  <!-- Grid pattern background -->
  <defs>
    <pattern id="grid2" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#grid2)"/>

  <!-- Red gradient glow -->
  <ellipse cx="600" cy="315" rx="400" ry="250" fill="url(#redglow)"/>
  <defs>
    <radialGradient id="redglow">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Document with X marks -->
  <rect x="480" y="160" width="160" height="200" rx="8" fill="#161b22" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>

  <!-- Content lines with red X marks -->
  <rect x="510" y="200" width="100" height="8" rx="2" fill="rgba(255,255,255,0.3)"/>
  <circle cx="520" cy="204" r="8" fill="#ef4444"/>
  <path d="M516 200 L524 208 M524 200 L516 208" stroke="white" stroke-width="2" stroke-linecap="round"/>

  <rect x="510" y="230" width="80" height="6" rx="2" fill="rgba(255,255,255,0.3)"/>
  <circle cx="520" cy="233" r="8" fill="#ef4444"/>
  <path d="M516 229 L524 237 M524 229 L516 237" stroke="white" stroke-width="2" stroke-linecap="round"/>

  <rect x="510" y="260" width="90" height="6" rx="2" fill="rgba(255,255,255,0.3)"/>
  <circle cx="520" cy="263" r="8" fill="#ef4444"/>
  <path d="M516 259 L524 267 M524 259 L516 267" stroke="white" stroke-width="2" stroke-linecap="round"/>

  <!-- Warning triangle -->
  <path d="M600 120 L650 200 L550 200 Z" fill="#ef4444"/>
  <text x="600" y="185" font-family="system-ui, sans-serif" font-size="40" font-weight="bold" fill="white" text-anchor="middle">!</text>

  <!-- Number 10 -->
  <text x="700" y="280" font-family="system-ui, sans-serif" font-size="80" font-weight="bold" fill="#ef4444" opacity="0.3">10</text>

  <!-- Text -->
  <text x="600" y="430" font-family="system-ui, sans-serif" font-size="32" font-weight="bold" fill="white" text-anchor="middle">Resume Mistakes to Avoid</text>
  <text x="600" y="470" font-family="system-ui, sans-serif" font-size="18" fill="rgba(255,255,255,0.6)" text-anchor="middle">Common errors that cost you the job</text>
</svg>