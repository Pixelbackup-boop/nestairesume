<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#0d1117"/>

  <!-- Grid pattern background -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Gradient glow -->
  <ellipse cx="600" cy="315" rx="400" ry="250" fill="url(#glow)"/>
  <defs>
    <radialGradient id="glow">
      <stop offset="0%" stop-color="#00dc82" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#00dc82" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Document icon -->
  <rect x="480" y="180" width="160" height="200" rx="8" fill="#161b22" stroke="#00dc82" stroke-width="2"/>
  <rect x="510" y="220" width="100" height="8" rx="2" fill="#00dc82" opacity="0.8"/>
  <rect x="510" y="245" width="80" height="6" rx="2" fill="rgba(255,255,255,0.3)"/>
  <rect x="510" y="265" width="90" height="6" rx="2" fill="rgba(255,255,255,0.3)"/>
  <rect x="510" y="285" width="70" height="6" rx="2" fill="rgba(255,255,255,0.3)"/>
  <rect x="510" y="310" width="100" height="6" rx="2" fill="rgba(255,255,255,0.3)"/>
  <rect x="510" y="330" width="60" height="6" rx="2" fill="rgba(255,255,255,0.3)"/>

  <!-- Checkmark badge -->
  <circle cx="620" cy="200" r="30" fill="#00dc82"/>
  <path d="M605 200 L615 212 L638 188" stroke="#0d1117" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Scanning lines animation effect -->
  <rect x="480" y="250" width="160" height="2" fill="#00dc82" opacity="0.5"/>

  <!-- Text -->
  <text x="600" y="450" font-family="system-ui, sans-serif" font-size="32" font-weight="bold" fill="white" text-anchor="middle">ATS-Friendly Resume Guide</text>
  <text x="600" y="490" font-family="system-ui, sans-serif" font-size="18" fill="rgba(255,255,255,0.6)" text-anchor="middle">Pass the algorithms, land the interview</text>
</svg>