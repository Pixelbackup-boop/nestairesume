<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#0d1117"/>

  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow">
      <stop offset="0%" stop-color="#00dc82" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#00dc82" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <ellipse cx="600" cy="315" rx="400" ry="250" fill="url(#glow)"/>

  <!-- Laptop icon -->
  <rect x="520" y="170" width="160" height="110" rx="8" fill="#161b22" stroke="#00dc82" stroke-width="2"/>
  <!-- Screen content lines -->
  <rect x="545" y="195" width="60" height="6" rx="2" fill="#00dc82" opacity="0.6"/>
  <rect x="545" y="210" width="110" height="6" rx="2" fill="rgba(255,255,255,0.25)"/>
  <rect x="545" y="225" width="90" height="6" rx="2" fill="rgba(255,255,255,0.25)"/>
  <rect x="545" y="240" width="100" height="6" rx="2" fill="rgba(255,255,255,0.15)"/>
  <!-- Laptop base -->
  <rect x="495" y="280" width="210" height="12" rx="4" fill="#161b22" stroke="#00dc82" stroke-width="1.5"/>

  <!-- Wi-Fi signal icon -->
  <path d="M590 155 Q600 140 610 155" stroke="#00dc82" stroke-width="2" fill="none" opacity="0.5"/>
  <path d="M583 162 Q600 142 617 162" stroke="#00dc82" stroke-width="2" fill="none" opacity="0.35"/>
  <path d="M576 169 Q600 144 624 169" stroke="#00dc82" stroke-width="2" fill="none" opacity="0.2"/>

  <!-- Globe accent -->
  <circle cx="660" y="330" r="20" stroke="#00dc82" stroke-width="1" fill="none" opacity="0.3"/>
  <ellipse cx="660" cy="330" rx="10" ry="20" stroke="#00dc82" stroke-width="1" fill="none" opacity="0.3"/>
  <line x1="640" y1="330" x2="680" y2="330" stroke="#00dc82" stroke-width="1" opacity="0.3"/>

  <text x="600" y="440" font-family="system-ui, sans-serif" font-size="32" font-weight="bold" fill="white" text-anchor="middle">Remote Work on Your Resume</text>
  <text x="600" y="480" font-family="system-ui, sans-serif" font-size="18" fill="rgba(255,255,255,0.6)" text-anchor="middle">How to list remote experience effectively</text>
</svg>
