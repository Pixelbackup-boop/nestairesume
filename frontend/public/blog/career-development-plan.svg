<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#0d1117"/>

  <!-- Grid pattern background -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Gradient glow -->
  <ellipse cx="600" cy="315" rx="400" ry="250" fill="url(#glow)"/>
  <defs>
    <radialGradient id="glow">
      <stop offset="0%" stop-color="#00dc82" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#00dc82" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Timeline/roadmap -->
  <line x1="400" y1="250" x2="800" y2="250" stroke="rgba(255,255,255,0.2)" stroke-width="4" stroke-linecap="round"/>

  <!-- Milestone 1 - Past -->
  <circle cx="450" cy="250" r="15" fill="#161b22" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
  <text x="450" y="290" font-family="system-ui, sans-serif" font-size="12" fill="rgba(255,255,255,0.4)" text-anchor="middle">Now</text>

  <!-- Milestone 2 - Current focus -->
  <circle cx="550" cy="250" r="20" fill="#00dc82"/>
  <path d="M540 250 L548 258 L562 242" stroke="#0d1117" stroke-width="3" fill="none"/>
  <text x="550" y="290" font-family="system-ui, sans-serif" font-size="12" fill="#00dc82" text-anchor="middle">90 Days</text>

  <!-- Milestone 3 -->
  <circle cx="650" cy="250" r="15" fill="#161b22" stroke="#00dc82" stroke-width="2"/>
  <text x="650" y="290" font-family="system-ui, sans-serif" font-size="12" fill="rgba(255,255,255,0.4)" text-anchor="middle">1 Year</text>

  <!-- Milestone 4 - Goal -->
  <circle cx="750" cy="250" r="18" fill="#161b22" stroke="#00dc82" stroke-width="2"/>
  <path d="M740 250 L750 240 L760 250 L750 260 Z" fill="#00dc82" opacity="0.8"/>
  <text x="750" y="290" font-family="system-ui, sans-serif" font-size="12" fill="rgba(255,255,255,0.4)" text-anchor="middle">5 Years</text>

  <!-- Ascending path/growth arrow -->
  <path d="M440 220 Q500 200 560 180 Q620 160 680 140 Q740 120 780 100" stroke="#00dc82" stroke-width="2" fill="none" stroke-dasharray="6 3"/>
  <polygon points="785,95 795,100 785,110" fill="#00dc82" transform="rotate(-25 785 102)"/>

  <!-- Document icon (plan) -->
  <rect x="530" y="320" width="140" height="80" rx="6" fill="#161b22" stroke="#00dc82" stroke-width="2"/>
  <rect x="550" y="340" width="60" height="6" rx="2" fill="#00dc82" opacity="0.8"/>
  <rect x="550" y="355" width="100" height="4" rx="2" fill="rgba(255,255,255,0.2)"/>
  <rect x="550" y="368" width="80" height="4" rx="2" fill="rgba(255,255,255,0.2)"/>
  <rect x="550" y="381" width="90" height="4" rx="2" fill="rgba(255,255,255,0.2)"/>

  <!-- Text -->
  <text x="600" y="450" font-family="system-ui, sans-serif" font-size="32" font-weight="bold" fill="white" text-anchor="middle">Career Development Plan</text>
  <text x="600" y="490" font-family="system-ui, sans-serif" font-size="18" fill="rgba(255,255,255,0.6)" text-anchor="middle">Free template and step-by-step guide</text>
</svg>