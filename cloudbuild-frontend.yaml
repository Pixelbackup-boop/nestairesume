# Cloud Build configuration for Frontend
# Triggered on push to main branch (frontend changes)

steps:
  # Step 1: Build Docker image with build args
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--build-arg'
      - 'NEXT_PUBLIC_API_URL=${_BACKEND_URL}'
      - '--build-arg'
      - 'NEXT_PUBLIC_SITE_URL=${_FRONTEND_URL}'
      - '--build-arg'
      - 'NEXT_PUBLIC_GA_MEASUREMENT_ID=${_GA_MEASUREMENT_ID}'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REPO}/frontend:${SHORT_SHA}'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REPO}/frontend:latest'
      - './frontend'
    id: 'build-docker'

  # Step 2: Push to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REPO}/frontend'
    id: 'push-image'
    waitFor: ['build-docker']

  # Step 3: Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'resume-frontend'
      - '--image'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REPO}/frontend:${SHORT_SHA}'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--memory'
      - '1Gi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '20'
      - '--concurrency'
      - '100'
      - '--timeout'
      - '60'
      - '--set-secrets'
      - 'NEXTAUTH_SECRET=NEXTAUTH_SECRET:latest,GOOGLE_CLIENT_ID=GOOGLE_CLIENT_ID:latest,GOOGLE_CLIENT_SECRET=GOOGLE_CLIENT_SECRET:latest'
      - '--set-env-vars'
      - 'NODE_ENV=production,NEXTAUTH_URL=${_FRONTEND_URL},BACKEND_URL=${_BACKEND_URL}'
      - '--allow-unauthenticated'
      - '--startup-probe'
      - 'httpGet.path=/api/health,httpGet.port=3000,initialDelaySeconds=0,failureThreshold=3,timeoutSeconds=3,periodSeconds=10'
      - '--liveness-probe'
      - 'httpGet.path=/api/health,httpGet.port=3000,initialDelaySeconds=0,failureThreshold=3,timeoutSeconds=3,periodSeconds=30'
    id: 'deploy'
    waitFor: ['push-image']

substitutions:
  _REGION: 'us-central1'
  _ARTIFACT_REPO: 'resume-builder'
  _FRONTEND_URL: 'https://bestairesumes.com'
  _BACKEND_URL: 'https://api.bestairesumes.com'
  _GA_MEASUREMENT_ID: 'G-9CSKL2WRXN'

options:
  logging: CLOUD_LOGGING_ONLY

timeout: '1200s'
